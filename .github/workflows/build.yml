name: build-windows  
  
on:  
  push:  
  pull_request:  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: windows-latest  
    defaults:  
      run:  
        shell: msys2 {0}  
    steps:  
      - name: 检出代码  
        uses: actions/checkout@v4  
  
      - name: 安装 MSYS2 环境  
        uses: msys2/setup-msys2@v2  
        with:  
          msystem: MINGW64  
          update: true  
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-libiconv make  
  
      - name: 编译 98ripper  
        run: make -C 98ripper-master/98ripper-master  
  
      - name: 上传可执行文件  
        uses: actions/upload-artifact@v4  
        with:  
          name: 98ripper-windows-x64  
          path: 98ripper-master/98ripper-master/98ripper.exe
